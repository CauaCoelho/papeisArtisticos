<mat-toolbar color="primary" class="toolbar-title">
  Adicionar Bloco
</mat-toolbar>

<mat-card class="card">
  <mat-card-content>
    <form class="form" [formGroup]="form">
      <div class="grid">
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" placeholder="Ex.: Bloco de desenho" />
          <mat-error *ngIf="form.get('nome')?.hasError('required') && form.get('nome')?.touched">
            O nome é obrigatório.
          </mat-error>
          <mat-error *ngIf="form.get('nome')?.hasError('minlength') && form.get('nome')?.touched">
            O nome deve ter pelo menos 3 caracteres.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Número de Folhas</mat-label>
          <input matInput type="number" formControlName="numeroFolhas" placeholder="Ex.: 30" />
          <mat-error *ngIf="form.get('numeroFolhas')?.hasError('required') && form.get('numeroFolhas')?.touched">
            O número de folhas é obrigatório.
          </mat-error>
          <mat-error *ngIf="form.get('numeroFolhas')?.hasError('min') && form.get('numeroFolhas')?.touched">
            O número de folhas deve ser pelo menos 1.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Textura</mat-label>
          <mat-select formControlName="textura">
            <mat-option [value]="null" disabled>Selecione</mat-option>
            <mat-option *ngFor="let textura of texturas" [value]="textura">{{ textura }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('textura')?.hasError('required') && form.get('textura')?.touched">
            A textura é obrigatória.
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Formato</mat-label>
          <mat-select formControlName="formato">
            <mat-option [value]="null" disabled>Selecione</mat-option>
            <mat-option *ngFor="let formato of formatos" [value]="formato">{{ formato }}</mat-option>
          </mat-select>
          <mat-error *ngIf="form.get('formato')?.hasError('required') && form.get('formato')?.touched">
            O formato é obrigatório.
          </mat-error>
        </mat-form-field>
      </div>

      <div class="actions">
        <button mat-raised-button routerLink="/blocos">Cancelar</button>
        <button mat-raised-button color="primary" (click)="salvar()" [disabled]="form.invalid">Salvar</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
