<mat-toolbar class="mat-toolbar" color="primary">
  <div class="flex-container">
    <span class="toolbar-title">Controle de Blocos</span>
  </div>
</mat-toolbar>

<div class="top-bar">
  <mat-form-field appearance="fill" class="flex-container">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Pesquisar por nome" />
  </mat-form-field>

  <button mat-fab color="accent" routerLink="/blocos/new">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="busca-container">
  <mat-form-field appearance="fill" class="busca-input">
    <mat-label>Pesquisar bloco</mat-label>
    <input matInput [(ngModel)]="termoBusca" placeholder="Ex: artístico" />
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="buscar()">Buscar</button>
</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
  <ng-container matColumnDef="numero">
    <th mat-header-cell *matHeaderCellDef> Número </th>
    <td mat-cell *matCellDef="let obj; let i = index"> {{ i + 1 }} </td>
  </ng-container>

  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let obj"> {{ obj.nome }} </td>
  </ng-container>

  <ng-container matColumnDef="numeroFolhas">
    <th mat-header-cell *matHeaderCellDef> Número de Folhas </th>
    <td mat-cell *matCellDef="let obj"> {{ obj.numeroFolhas }} </td>
  </ng-container>

  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef> Ação </th>
    <td mat-cell *matCellDef="let obj">
      <button mat-icon-button color="primary" [routerLink]="['/blocos', obj.id]">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="openDialog('4000ms', '2500ms')">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

<mat-paginator [pageSizeOptions]="[5, 10, 20]" [pageIndex]="page" [length]="totalRecords" (page)="paginar($event)"></mat-paginator>
