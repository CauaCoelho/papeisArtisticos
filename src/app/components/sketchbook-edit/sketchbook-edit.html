<form [formGroup]="form">

  <mat-form-field appearance="fill">
    <mat-label>Nome do Sketchbook</mat-label>
    <input matInput formControlName="nome">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>QuantidadeFolhas</mat-label>
    <input matInput formControlName="quantidadefolhas" maxlength="2">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="salvar()">
    Salvar
  </button>

</form>
