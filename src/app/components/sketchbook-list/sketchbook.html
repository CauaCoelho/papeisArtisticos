<mat-toolbar class="mat-toolbar" color="primary">
  <div class="flex-container">
    <span class="toolbartitle"> Controle de Sketchbooks </span>
  </div>
</mat-toolbar>

<div class="top-bar">
  <mat-form-field appearance="fill" class="filtro">
    <mat-label>Filtro</mat-label>
    <input matInput (keyup)="applyFilter($event)" placeholder="Por exemplo: Sketchbook de halloween" #input>
  </mat-form-field>

  <button mat-fab color="primary" routerLink="/sketchbooks/new">
    <mat-icon>add</mat-icon>
  </button>
</div>

<div class="busca-container">

  <mat-form-field appearance="fill" class="busca-input">
    <mat-label>Pesquisar papel</mat-label>
    <input matInput [(ngModel)]="termoBusca" placeholder="Ex: papel aquarela">
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="buscar()">
    Buscar
  </button>

</div>

<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Número Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> Número </th>
    <td mat-cell *matCellDef="let obj; let i = index"> {{i+1}} </td>
  </ng-container>

  <!-- Nome Column -->
  <ng-container matColumnDef="idCapa">
    <th mat-header-cell *matHeaderCellDef> Capa </th>
    <td mat-cell *matCellDef="let obj"> {{obj.capa?.nome}} </td>
  </ng-container>

  <!-- QuantidadePáginas Column -->
  <ng-container matColumnDef="quantidadeFolhas">
    <th mat-header-cell *matHeaderCellDef> Quantidade de Páginas </th>
    <td mat-cell *matCellDef="let obj"> {{obj.quantidadeFolhas}} </td>
  </ng-container>

  <!-- Acao  Column -->
  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef> Ação </th>
    <td mat-cell *matCellDef="let obj">
      <button mat-icon-button color="primary" [routerLink]="['/sketchbooks', obj.id]">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" (click)="openDialog('4000ms', '2500ms')">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator [pageSizeOptions]="[2, 4, 8]" [pageIndex]="page" [length]="totalRecords" (page)="paginar($event)">
</mat-paginator>
