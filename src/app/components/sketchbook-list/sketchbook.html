<mat-toolbar class="mat-toolbar">
  <div class="flex-container">
    <span class="toolbar-title"> Controle de Sketchbooks </span>
  </div>
</mat-toolbar>

<mat-form-field appearance="fill" class="flex-container">
  <mat-label>Filtro</mat-label>
  <input matInput (keyup)="applyFilter($event)" placeholder="Por exemplo: Tocantins" #input>
</mat-form-field>
<button mat-fab class="accent" routerLink="/sketchbooks/new">
  <mat-icon>add</mat-icon>
</button>
<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">

  <!-- Número Column -->
  <ng-container matColumnDef="numero">
    <th mat-header-cell *matHeaderCellDef> Número </th>
    <td mat-cell *matCellDef="let obj; let i = index"> {{i+1}} </td>
  </ng-container>

  <!-- Nome Column -->
  <ng-container matColumnDef="nome">
    <th mat-header-cell *matHeaderCellDef> Nome </th>
    <td mat-cell *matCellDef="let obj"> {{obj.nome}} </td>
  </ng-container>

  <!-- Sigla Column -->
  <ng-container matColumnDef="sigla">
    <th mat-header-cell *matHeaderCellDef> Sigla </th>
    <td mat-cell *matCellDef="let obj"> {{obj.sigla}} </td>
  </ng-container>

  <!-- Acao  Column -->
  <ng-container matColumnDef="acao">
    <th mat-header-cell *matHeaderCellDef> Ação </th>
    <td mat-cell *matCellDef="let obj">
      <button mat-icon-button color="primary" routerLink="/sketchbooks/edit/{{obj.id}}">
        <mat-icon>edit</mat-icon>
      </button>
      <button mat-icon-button color="warn" 
          (click)="openDialog('4000ms', '2500ms')">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>

<mat-paginator 
  [pageSizeOptions]="[2, 4, 8]"
  [pageIndex]="pageSize"
  [length]="totalRecords"
  (page)="paginar($event)">
</mat-paginator>
