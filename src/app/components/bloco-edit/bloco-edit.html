<form [formGroup]="form" class="form-container">
  <mat-form-field appearance="fill">
    <mat-label>Nome do Bloco</mat-label>
    <input matInput formControlName="nome" />
    <mat-error [hidden]="form.get('nome')?.hasError('required') && form.get('nome')?.touched">
      O nome do bloco é obrigatório.
    </mat-error>
    <mat-error [hidden]="form.get('nome')?.hasError('minlength') && form.get('nome')?.touched">
      O nome deve ter pelo menos 3 caracteres.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Número de Folhas</mat-label>
    <input matInput type="number" formControlName="numeroFolhas" />
    <mat-error [hidden]="form.get('numeroFolhas')?.hasError('required') && form.get('numeroFolhas')?.touched">
      O número de folhas é obrigatório.
    </mat-error>
    <mat-error [hidden]="form.get('numeroFolhas')?.hasError('min') && form.get('numeroFolhas')?.touched">
      O número de folhas deve ser pelo menos 20.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Textura</mat-label>
    <input matInput formControlName="textura" />
    <mat-error [hidden]="form.get('textura')?.hasError('required') && form.get('textura')?.touched">
      A textura é obrigatória.
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Formato</mat-label>
    <input matInput formControlName="formato" />
    <mat-error [hidden]="form.get('formato')?.hasError('required') && form.get('formato')?.touched">
      O formato é obrigatório.
    </mat-error>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="salvar()" [disabled]="form.invalid">
    Salvar
  </button>
</form>
